  <!--
    Página exibida pelo Netlify quando um endereço não existe.
    Os links começam com "/" (raiz do site) porque esta página pode aparecer

  -->

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="erro-404">
    <a href="/" class="logo" aria-label="Nexo Web — página inicial">
      <span class="logo__icone" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 19V5l12 14V5"/></svg>
      </span>
      Nexo Web

    <h1>Página não encontrada</h1>
    <p class="erro-404__texto">O endereço que você tentou abrir não existe ou mudou de lugar.</p>
    <div class="hero__botoes">
      <a class="btn btn--primario" href="/">Voltar ao início</a>
      <a class="btn btn--secundario" href="/modelos.html">Ver modelos</a>
    </div>
  </main>
</body>
</html>
